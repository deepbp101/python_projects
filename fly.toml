app = "wedding-planner"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  STORAGE_DRIVER = "s3"

[http_service]
  internal_port = 3000
  force_https = true

  # Not zero. Socket.IO holds a live connection per collaborator, and a machine
  # that stops when HTTP goes quiet drops every one of them — the couple would
  # watch presence disappear while the page sat open in front of them.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

# One machine, deliberately. Socket.IO rooms live in the process's memory, so
# two machines means two collaborators can be in the "same" room and never see
# each other. Scaling past one needs the Redis adapter first.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
